[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dataerai-hls4ml"
version = "0.1.0"
description = "Dataerai data-preservation & provenance integration for the hls4ml tutorial pipeline"
readme = "DATAERAI_PROVENANCE.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
# The Dataerai SDK (preservation via the local daemon). Install from the
# dataerai monorepo: `pip install -e <dataerai>/sdk/python`.
sdk = ["dataerai"]
# Full end-to-end pipeline driver.
pipeline = ["papermill>=2.4", "nbformat>=5"]
test = ["pytest>=7"]

[project.scripts]
dataerai-hls4ml = "dataerai_hls4ml.cli:main"

[tool.setuptools]
packages = ["dataerai_hls4ml"]

[tool.pytest.ini_options]
testpaths = ["dataerai_hls4ml/tests"]
